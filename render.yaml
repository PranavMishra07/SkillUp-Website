services:
  - type: web
    name: django-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: |
      python manage.py makemigrations &&
      python manage.py migrate &&
      gunicorn backend.wsgi:application
    workingDir: backend
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: backend.settings
      - key: SECRET_KEY
        value: your-very-secret-key
      - key: ALLOWED_HOSTS
        value: skillup-website.onrender.com
      - key: DEBUG
        value: "False"

  - type: web
    name: react-frontend
    env: static
    buildCommand: cd skilup-frontend && npm install && npm run build
    staticPublishPath: skilup-frontend/dist
    headers:
      - source: "/*"
        headers:
          - key: "Cache-Control"
            value: "no-cache"
    routes:
      - type: rewrite
        source: "/*"
        destination: /index.html
